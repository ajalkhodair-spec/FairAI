name: FairAI MVP

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    paths:
      - "circuits/**"
      - "hardhat/**"
      - "scripts/**"
      - "fairai_revision/**"
      - "configs/revision/**"
      - "schemas/**"
      - "tests/**"
      - "Makefile"
      - "requirements-lock.txt"
      - "docker-compose.ipfs.yml"
      - "BLOCKERS.md"
      - "CITATION.cff"
      - "README.md"
      - "RELEASE_CHECKLIST.md"
      - "docs/revision/**"
      - "outputs/major_revision/**"
      - ".github/workflows/fairai-mvp.yml"
  pull_request:
    paths:
      - "circuits/**"
      - "hardhat/**"
      - "scripts/**"
      - "fairai_revision/**"
      - "configs/revision/**"
      - "schemas/**"
      - "tests/**"
      - "Makefile"
      - "requirements-lock.txt"
      - "docker-compose.ipfs.yml"
      - "BLOCKERS.md"
      - "CITATION.cff"
      - "README.md"
      - "RELEASE_CHECKLIST.md"
      - "docs/revision/**"
      - "outputs/major_revision/**"
      - ".github/workflows/fairai-mvp.yml"

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hardhat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx hardhat compile
      - run: npx hardhat test

  python-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -r requirements-lock.txt
      - run: npm ci
        working-directory: hardhat
      - run: echo "$GITHUB_WORKSPACE/hardhat/node_modules/.bin" >> "$GITHUB_PATH"
      - run: python -m compileall -q fairai_revision scripts tests
      - run: python -m unittest discover -s tests
      - run: >-
          python -m fairai_revision.run
          --config configs/revision/smoke.yaml
          --output-root "${RUNNER_TEMP}/fairai-revision"
          --run-id ci-smoke

  ipfs-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-lock.txt
      - run: docker compose -f docker-compose.ipfs.yml up -d --wait
      - run: >-
          python -m fairai_revision.run
          --config configs/revision/ci_ipfs.yaml
          --output-root "${RUNNER_TEMP}/fairai-ipfs"
          --run-id ci-two-peer-kubo
      - if: always()
        run: docker compose -f docker-compose.ipfs.yml down -v
